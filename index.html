<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#231F1B">
  <meta name="color-scheme" content="light">
  <title>배달 타임라인</title>
  <link rel="stylesheet" href="css/app.css">
  <script>
    try {
      if (localStorage.getItem("delivery-timeline.v1.password")) {
        document.documentElement.classList.add("booting");
      }
    } catch (e) {}
  </script>
</head>
<body>
  <section id="lock-screen" class="lock">
    <div class="lock-card">
      <p class="eyebrow">잠김</p>
      <h1>배달 타임라인</h1>
      <p class="lede">비밀번호로 배달 기록을 엽니다. 복호화는 이 기기에서만 합니다.</p>
      <p id="boot-msg" class="boot">기록을 여는 중…</p>
      <form id="lock-form">
        <label class="field" for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false" required>
        <label class="remember" for="remember">
          <input id="remember" type="checkbox">
          <span>이 기기에 기억</span>
        </label>
        <p id="lock-error" class="error" role="alert"></p>
        <button id="unlock" type="submit">열기</button>
      </form>
    </div>
  </section>

  <div id="app" class="app" hidden>
    <header class="top">
      <h1>배달 타임라인</h1>
      <button id="lock-btn" type="button">잠금</button>
    </header>
    <div class="controls">
      <div id="dates" class="dates" role="tablist" aria-label="날짜"></div>
      <div class="toggles">
        <button id="toggle-night" class="chip" type="button" aria-pressed="true"><span class="dot night" aria-hidden="true"></span>야간</button>
        <button id="toggle-day" class="chip" type="button" aria-pressed="true"><span class="dot day" aria-hidden="true"></span>주간</button>
        <button id="toggle-path" class="chip" type="button" aria-pressed="false">경로 보기</button>
      </div>
    </div>
    <div class="workspace">
      <section class="map-pane" id="map-pane">
        <div id="map"></div>
        <div id="schema" class="schema" hidden></div>
        <p id="map-note" class="map-note" hidden></p>
        <div id="schema-info" class="floating" hidden></div>
      </section>
      <section class="list-pane" id="list-pane" aria-label="배달 목록">
        <p id="summary" class="summary"></p>
        <div id="list"></div>
      </section>
    </div>
  </div>

  <noscript><p class="noscript">이 페이지는 브라우저에서 기록을 복호화합니다. JavaScript를 켜 주세요.</p></noscript>
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
